version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    # New versions wait a week before Dependabot proposes them (time for a bad release to be pulled).
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # PHPUnit 13 needs PHP 8.4; the bundle supports PHP 8.3 (CI tests 8.3).
      - dependency-name: "phpunit/phpunit"
        versions: [">=13"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directories: ["/test/docs", "/test/e2e"]
    # New versions wait a week before Dependabot proposes them (time for a bad release to be pulled).
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    # New versions wait a week before Dependabot proposes them (time for a bad release to be pulled).
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
  # Base images are pinned by digest (OpenSSF Scorecard: Pinned-Dependencies); this keeps the
  # digests and patch/minor tags current. Majors (a new Node, PHP, … line) are a decision, not an update.
  - package-ecosystem: "docker"
    directories:
      - "/demo"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      docker:
        patterns: ["*"]
